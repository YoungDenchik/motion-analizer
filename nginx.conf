server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    # ── React SPA ─────────────────────────────────────────────────────────────
    # Any route not matching a real file falls back to index.html so that
    # React Router can handle /analyze, /record, /library, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets — long cache (Vite appends content hash to filenames)
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        try_files   $uri =404;
    }

    # ── Annotated video download — buffering ON so range requests work ────────
    # More specific prefix wins over /api/ below; nginx picks longest match.
    location /api/video/ {
        proxy_pass             http://backend:8000/api/video/;
        proxy_http_version     1.1;

        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;

        # Forward Range / If-Range so the browser can seek into the video
        proxy_set_header       Range             $http_range;
        proxy_set_header       If-Range          $http_if_range;

        # Buffer the response on disk — allows nginx to serve byte-range slices
        proxy_buffering        on;
        proxy_buffer_size      256k;
        proxy_buffers          8 2m;
        proxy_max_temp_file_size 2048m;   # up to 2 GB video

        proxy_read_timeout     600s;
        proxy_send_timeout     600s;
        proxy_connect_timeout   30s;
    }

    # ── API proxy → FastAPI backend ───────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Video uploads can be large (500 MB cap)
        client_max_body_size 500m;

        # Analysis pipeline can run for up to 5 minutes on long videos
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout  30s;

        # Disable buffering for /api/status polling (fast small responses)
        proxy_buffering off;
    }
}
